[project]
name = "stock-analysis"
version = "0.1.0"
description = "Borsa Analiz Sistemi - Bilgilendirme ve Teknik Analiz Altyapısı"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "asyncpg>=0.30.0",
    "redis>=5.1.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "torch>=2.5.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "pre-commit>=4.0.0",
    "pandas-stubs>=2.2.0",
]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"migrations/env.py" = ["E402"]
"migrations/versions/*" = ["E501", "W291", "D"]
"src/stock_analysis/api/*" = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "unit: Saf birim testleri (DB, ag ve harici I/O bagimsiz)",
    "integration: Entegrasyon testleri (DB, API ve kuyruk bilesenleri)",
    "security: Guvenlik, erisim kontrolu ve zaafiyet testleri",
    "contract: API ve veri saglayici sema sozlesme testleri",
    "timeseries: Zaman serisi, sira, eksik veri, takvim ve kurumsal islem testleri",
    "models: Model testleri (veri sizintisi, tekrarlanabilirlik, baseline kiyasi, uc durumlar)",
    "e2e: Uctan uca kullanici senaryolari",
    "resilience: Yuk, eszamanlilik, saglayici kesintisi ve dayaniklilik testleri",
]


